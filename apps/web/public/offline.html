<!DOCTYPE html>
<html lang="km" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Stunity – គ្មាន Internet</title>
  <link rel="icon" href="/favicon.ico" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --orange: #ea580c;
      --orange-light: #fb923c;
      --dark: #0f172a;
      --dark-2: #1e293b;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
    }

    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--dark);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top, 20px) env(safe-area-inset-right, 20px) env(safe-area-inset-bottom, 20px) env(safe-area-inset-left, 20px);
      padding-bottom: max(env(safe-area-inset-bottom, 20px), 20px);
      overflow: hidden;
    }

    /* Decorative background orbs */
    .bg-orb {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      filter: blur(80px);
      opacity: 0.15;
    }
    .bg-orb-1 {
      width: 400px; height: 400px;
      background: var(--orange);
      top: -100px; right: -100px;
      animation: float 8s ease-in-out infinite;
    }
    .bg-orb-2 {
      width: 300px; height: 300px;
      background: #3b82f6;
      bottom: -80px; left: -80px;
      animation: float 10s ease-in-out infinite reverse;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-30px); }
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 360px;
      width: 100%;
      padding: 0 24px;
    }

    /* Logo */
    .logo-wrapper {
      margin-bottom: 40px;
    }
    .logo-wrapper img {
      height: 36px;
      width: auto;
      filter: brightness(0) invert(1);
      opacity: 0.9;
    }

    /* Icon */
    .icon-wrapper {
      width: 100px;
      height: 100px;
      margin: 0 auto 32px;
      background: linear-gradient(135deg, rgba(234,88,12,0.2) 0%, rgba(251,146,60,0.1) 100%);
      border: 2px solid rgba(234,88,12,0.3);
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      animation: pulse-glow 3s ease-in-out infinite;
    }
    .icon-wrapper::before {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 34px;
      border: 1px solid rgba(234,88,12,0.15);
    }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(234,88,12,0.3); }
      50% { box-shadow: 0 0 30px 10px rgba(234,88,12,0.15); }
    }

    .icon-wrapper svg {
      width: 48px;
      height: 48px;
      color: var(--orange-light);
    }

    /* Title */
    h1 {
      font-size: 26px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }

    /* Subtitle */
    .subtitle {
      font-size: 15px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 40px;
    }

    /* Retry Button */
    .btn-retry {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, var(--orange), var(--orange-light));
      color: white;
      font-size: 15px;
      font-weight: 600;
      padding: 14px 32px;
      border-radius: 16px;
      border: none;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 24px rgba(234,88,12,0.35);
      margin-bottom: 16px;
      width: 100%;
      justify-content: center;
    }
    .btn-retry:active {
      transform: scale(0.97);
    }
    .btn-retry:hover {
      box-shadow: 0 6px 30px rgba(234,88,12,0.45);
    }

    /* Status dots */
    .status-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 32px;
      padding: 12px 20px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      animation: blink 2s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .status-text {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* Tip */
    .tip {
      margin-top: 24px;
      font-size: 12px;
      color: rgba(148,163,184,0.6);
    }
    .tip strong {
      color: rgba(148,163,184,0.9);
    }
  </style>
</head>
<body>
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>

  <div class="container">
    <!-- Logo -->
    <div class="logo-wrapper">
      <img src="/Stunity.png" alt="Stunity" onerror="this.style.display='none'" />
    </div>

    <!-- Offline Icon -->
    <div class="icon-wrapper">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 1l22 22"/>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
        <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
        <line x1="12" y1="20" x2="12.01" y2="20"/>
      </svg>
    </div>

    <h1>គ្មានការតភ្ជាប់</h1>
    <p class="subtitle">
      Stunity ត្រូវការ Internet ដើម្បីផ្ទុកទំព័រថ្មី។<br />
      សូមពិនិត្យ WiFi ឬ Mobile Data របស់អ្នក ហើយព្យាយាមម្ដងទៀត។
    </p>

    <button class="btn-retry" onclick="retryConnection()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"/>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
      </svg>
      ព្យាយាមម្ដងទៀត
    </button>

    <div class="status-row">
      <div class="status-dot" id="statusDot"></div>
      <span class="status-text" id="statusText">មិនបានភ្ជាប់ Internet</span>
    </div>

    <p class="tip">
      <strong>គន្លឹះ:</strong> ទំព័រដែលបានបើកពីមុនអាចមាននៅក្នុង cache
    </p>
  </div>

  <script>
    function retryConnection() {
      const btn = document.querySelector('.btn-retry');
      const svg = btn.querySelector('svg');
      svg.style.animation = 'spin 0.8s linear infinite';
      svg.style.transformOrigin = 'center';
      
      const style = document.createElement('style');
      style.textContent = '@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }';
      document.head.appendChild(style);

      setTimeout(() => {
        window.location.reload();
      }, 800);
    }

    // Monitor connectivity
    function updateStatus() {
      const dot = document.getElementById('statusDot');
      const text = document.getElementById('statusText');
      if (navigator.onLine) {
        dot.style.background = '#22c55e';
        dot.style.animation = 'none';
        text.textContent = 'ភ្ជាប់ Internet ហើយ — កំពុងបញ្ជូន...';
        setTimeout(() => window.location.reload(), 1000);
      }
    }

    window.addEventListener('online', updateStatus);
    updateStatus();
  </script>
</body>
</html>
